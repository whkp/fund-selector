name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支连续推送时，取消上一次还没跑完的任务，不浪费 runner 时间。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端测试与静态检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 与 Dockerfile / .python-version 保持一致：numpy 2.5.x 要求 >= 3.12，
          # 在更老的解释器上会被静默换成另一个版本，测的就不是同一套东西了。
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: 安装依赖
        # 用 lock 而不是 requirements.txt：CI 要验证的正是「部署时装到的那套版本」。
        run: pip install -r requirements.lock

      - name: 运行测试
        run: python -m pytest tests -q

      - name: 代码检查
        # 版本区间与 backend/pyproject.toml 里声明的 test extra 对齐，
        # 避免 CI 上的 ruff 比本地新、规则默认值漂移导致两边结论不一致。
        run: |
          pip install "ruff>=0.16,<1"
          ruff check .

  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 构建
        run: npm run build
