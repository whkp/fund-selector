services:
  - type: web
    name: fund-compass-api
    runtime: python
    # 用 lock 而不是 requirements.txt：后者是区间约束，重装结果不可复现。
    # lock 的生成方式、平台假设与局限见 backend/requirements.lock 头部注释。
    buildCommand: pip install -r backend/requirements.lock
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: FUND_COMPASS_MODE
        value: REFERENCE
      # 只挡匿名写操作（数据全量刷新），不影响登录用户维护自己的观察列表。
      - key: FUND_COMPASS_PUBLIC_WRITE_ENABLED
        value: "false"
      # 必须为 true。这个开关由 create_run 里的 require_public_research() 检查，
      # 而该端点在认证之后才执行到这里 —— 配成 false 的话，即便是登录用户
      # 也会被 403，云端会表现为「模型配好了却永远出不了研究结果」。
      # 匿名刷模型的风险已经由强制登录 + 按用户配额挡住，不需要靠这个开关兜。
      - key: FUND_COMPASS_PUBLIC_RESEARCH_ENABLED
        value: "true"
      - key: FUND_COMPASS_CORS_ORIGINS
        sync: false
      - key: FUND_COMPASS_AKSHARE_ENABLED
        value: "true"
      - key: FUND_COMPASS_LLM_PROVIDER
        sync: false
      - key: FUND_COMPASS_LLM_BASE_URL
        sync: false
      - key: FUND_COMPASS_LLM_API_KEY
        sync: false
      - key: FUND_COMPASS_LLM_MODEL
        sync: false
      - key: FUND_COMPASS_KNOWLEDGE_BASE_PATH
        value: ""
      # ── 会话密钥与邀请码：必须由平台提供，不能依赖文件系统 ──────────────
      # auth.py 在文件缺失时会**重新生成** JWT 密钥和邀请码。Render 的文件系统
      # 对每次部署都是全新的，所以不配这两个变量的后果是：
      #   - 每次部署换 JWT 密钥 → 所有已登录用户被踢下线
      #   - 每次部署换邀请码   → 已发出去的邀请码全部作废
      #
      # generateValue：Render 生成 base64 编码的 256-bit 随机值；已存在则不覆盖，
      # 因此跨部署保持不变。密钥不需要人知道，随机是最强的选择。
      - key: FUND_COMPASS_JWT_SECRET
        generateValue: true
      # sync: false → 值不写进仓库，在 Render 控制台填。
      # 邀请码必须是人类可输入、可转发的短码，所以不能用 generateValue 的 base64。
      # ⚠️ 注意：sync: false 只在 Blueprint **首次创建**时弹出填写提示。若服务
      #    已经存在，要在 Dashboard → Environment 里手动新增这个变量。
      - key: FUND_COMPASS_INVITE_CODE
        sync: false
      # ── 数据库：必须换成外部 Postgres，不能用默认的 SQLite ──────────────
      # 默认库是 SQLite（backend/data/fund-compass.db），而 Render 的文件系统是
      # 临时的：每次部署、以及空闲 15 分钟休眠后唤醒，容器都会重建，整个库清空。
      # 后果不是丢行情数据（那些每次从 AKShare 现拉），而是用户账号、对话、
      # 观察列表、风险测评一起消失，且没有备份。
      #
      # ⚠️ 别用 Render 自家的免费 Postgres —— 它只是把「每次部署丢」变成
      #    「第 30 天丢」（创建后 30 天删除，14 天宽限）。用 Neon / Supabase
      #    这类不限期免费层，把连接串填到这里，原文粘贴即可：
      #      postgresql://user:pass@host/db?sslmode=require
      #    代码会自行补齐 asyncpg 驱动、改写 sslmode、关闭预处理语句缓存
      #    （Neon 的 -pooler / pgbouncer 端点必需），见 app/db/session.py。
      #    首次启动会自动跑 Alembic 迁移建表。
      - key: FUND_COMPASS_DATABASE_URL
        sync: false
